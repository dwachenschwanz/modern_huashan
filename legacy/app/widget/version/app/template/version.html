<a ng-click="open()" href="#">About</a>

<script type="text/ng-template" id="versionContent.html">
    <div class="modal-header">
        <h3 class="modal-title">About Huashan</h3>
    </div>
    <div class="modal-body">
        <div ng-repeat="version in versions">
            <h3>{{version.versionNo}}</h3>
            <ul>
                <li ng-repeat="change in version.ChangeLog">
                    {{change}}
                </li>
            </ul>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary" ng-click="close()">Close</button>
    </div>
</script>
