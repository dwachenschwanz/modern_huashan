# Replaces nginx:alpine's /etc/nginx/conf.d/default.conf (see Dockerfile).
#
# Caching policy: Vite fingerprints everything under /assets/ (the hash in
# the filename changes whenever the content does), so those files can be
# cached forever. Everything else - index.html, which points at the current
# hashes, and the unhashed files copied from public/ - must be revalidated
# on every load so a new deployment is picked up without a hard refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
